<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPAM · Salesforce Agentic Acceleration Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10122B;
    --muted:#5C627A;
    --faint:#8990A6;
    --line:#E7E9F2;
    --bg:#F7F8FC;
    --paper:#FFFFFF;
    --epam:#0047FF;
    /* per-stage accent, updated by JS */
    --accent:#001965;
    --accent-soft:rgba(0,25,101,.08);
    /* loop colours */
    --roadmap:#8453D2;
    --mock:#0047FF;
    --prove:#0FA39A;
    --radius:20px;
    --shadow:0 18px 40px -22px rgba(16,18,43,.45);
    --shadow-sm:0 8px 22px -16px rgba(16,18,43,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* shifting background tint driven by current stage accent */
  .bg-glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 55% at 82% 8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(55% 50% at 8% 92%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%);
    transition:background .6s ease;
  }
  .app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

  /* ---------- Header ---------- */
  header{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;
    padding:14px clamp(16px,4vw,40px);
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:saturate(140%) blur(10px);
    backdrop-filter:saturate(140%) blur(10px);
    flex:none;position:relative;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;flex:none;justify-self:start}
  .logo{
    font-weight:800;letter-spacing:.5px;font-size:18px;color:#fff;
    background:var(--epam);padding:6px 10px;border-radius:8px;line-height:1;
  }
  .brand .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .stepper{display:flex;gap:6px;justify-self:center;flex-wrap:wrap;justify-content:center}
  .step{
    display:flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:var(--paper);border-radius:999px;padding:5px 11px 5px 6px;cursor:pointer;
    font-size:12.5px;font-weight:600;color:var(--muted);transition:.2s;line-height:1;
  }
  .step:hover{border-color:var(--accent);color:var(--ink)}
  .step .num{
    width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
    background:var(--bg);color:var(--faint);font-size:11px;font-weight:700;transition:.2s;flex:none;
  }
  .step.done .num{background:var(--s-color);color:#fff}
  .step.current{border-color:var(--s-color);color:var(--ink);background:color-mix(in srgb,var(--s-color) 9%,#fff)}
  .step.current .num{background:var(--s-color);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--s-color) 22%,transparent)}
  .step .lbl{display:none}
  @media(min-width:1120px){.step .lbl{display:inline}}
  @media(max-width:680px){.brand .eyebrow{display:none}}
  @media(max-width:520px){header{gap:10px}}

  /* ---------- Appendix navigator (jump to non-stage / reference screens) ---------- */
  .apx{position:relative;justify-self:end}
  .apx-btn{
    display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);
    border-radius:999px;padding:6px 11px 6px 12px;font:inherit;font-size:12.5px;font-weight:700;
    color:var(--muted);cursor:pointer;transition:.18s;line-height:1;white-space:nowrap;
  }
  .apx-btn:hover{border-color:var(--accent);color:var(--ink)}
  .apx-btn.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 9%,#fff)}
  .apx-btn svg{flex:none}
  .apx-btn .chev{transition:transform .2s}
  .apx-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
  @media(max-width:860px){.apx-btn .apx-lbl{display:none}}

  .apx-menu{
    position:absolute;top:calc(100% + 9px);right:0;z-index:40;width:266px;
    background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);
    padding:7px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease,visibility .2s;
  }
  .apx.open .apx-menu{opacity:1;visibility:visible;transform:none}
  .apx-hd{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:6px 10px 5px}
  .apx-item{
    display:grid;grid-template-columns:auto 1fr;column-gap:11px;row-gap:2px;align-items:center;
    width:100%;text-align:left;border:0;background:none;font:inherit;padding:9px 10px;border-radius:11px;cursor:pointer;color:var(--ink);transition:.15s;
  }
  .apx-item:hover{background:var(--bg)}
  .apx-item.on{background:color-mix(in srgb,var(--epam) 9%,#fff)}
  .apx-item .apx-ic{grid-row:1 / span 2;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
  .apx-item .apx-t{grid-column:2;align-self:end;font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
  .apx-item .apx-d{grid-column:2;align-self:start;font-size:11px;color:var(--muted);line-height:1.3}

  .progress{height:3px;background:var(--line);flex:none}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.4,0,.2,1)}

  /* ---------- Stage area ---------- */
  .stage-wrap{position:relative;flex:1;overflow:hidden}
  .screen{
    position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    padding:clamp(16px,3vh,40px) clamp(18px,5vw,56px);
    opacity:0;visibility:hidden;transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease, visibility .5s;
  }
  .screen.active{opacity:1;visibility:visible;transform:none}
  .inner{max-width:1080px;margin:0 auto;width:100%}

  /* ---------- Overview / hero ---------- */
  .screen.cover{display:flex;flex-direction:column;align-items:center;justify-content:safe center}
  .screen.cover>.inner{width:100%}
  .hero-grid{display:grid;grid-template-columns:minmax(280px,.92fr) minmax(380px,1.04fr);gap:clamp(28px,5vw,64px);align-items:center}
  @media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:26px;align-items:start}}
  .hero .kicker{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--epam)}
  .hero h1{font-size:clamp(30px,4.7vw,50px);line-height:1.04;letter-spacing:-.02em;margin:12px 0 16px;font-weight:800}
  .hero h1 span{color:var(--epam)}
  .hero p.lede{font-size:clamp(15px,1.7vw,18px);color:var(--muted);max-width:480px;line-height:1.55}

  /* the vertical journey through the six stages */
  .journey{display:flex;flex-direction:column}
  .jstep{position:relative;display:grid;grid-template-columns:46px 1fr;gap:15px;align-items:start;text-align:left;
    background:none;border:0;padding:0 0 14px;cursor:pointer;font:inherit;color:var(--ink);opacity:0;transform:translateY(10px)}
  .screen.active .journey .jstep{animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
  .jstep:last-child{padding-bottom:0}
  .jstep::before{content:"";position:absolute;left:22px;top:44px;bottom:-2px;width:2px;
    background:linear-gradient(var(--n-color),var(--next-color));opacity:.55}
  .jstep:last-child::before{display:none}
  .jnode{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;
    background:var(--n-color);box-shadow:0 9px 18px -8px var(--n-color);position:relative;z-index:1;transition:transform .18s}
  .jbody{display:block;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-sm);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
  .jstep:hover .jbody{transform:translateX(4px);box-shadow:var(--shadow);border-color:var(--n-color)}
  .jstep:hover .jnode{transform:scale(1.07)}
  .jhd{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .jhd .jic{color:var(--n-color);display:grid;place-items:center;flex:none}
  .jdesc{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:4px}

  /* ---------- Stage screens ---------- */
  .stage-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:6px}
  .stage-num{
    width:62px;height:62px;border-radius:16px;flex:none;display:grid;place-items:center;color:#fff;
    font-size:26px;font-weight:800;background:var(--accent);box-shadow:0 12px 26px -12px var(--accent);position:relative;
  }
  .stage-num svg{position:absolute;width:20px;height:20px;right:-6px;bottom:-6px;background:#fff;border-radius:8px;padding:3px;color:var(--accent);box-shadow:var(--shadow-sm)}
  .stage-head .meta .of{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .stage-head .meta h2{font-size:clamp(23px,3.2vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.08;margin-top:3px}
  .kick{font-size:clamp(15px,1.7vw,18.5px);color:var(--muted);line-height:1.5;margin:14px 0 18px;max-width:760px}
  .kick strong{color:var(--ink);font-weight:600}

  /* progressive steps toward stage completion */
  .steps{position:relative;max-width:800px;margin-top:4px}
  .stp{position:relative;display:grid;grid-template-columns:48px 1fr;gap:18px;padding-bottom:22px;opacity:0;transform:translateY(10px)}
  .screen.active .stp{animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
  .stp::before{content:"";position:absolute;left:23px;top:12px;bottom:-10px;width:2px;background:color-mix(in srgb,var(--accent) 28%,#fff)}
  .stp:last-child::before{display:none}
  .stp .mk{
    width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:16px;background:var(--paper);color:var(--accent);
    border:2px solid var(--accent);position:relative;z-index:1;box-shadow:var(--shadow-sm);
  }
  .stp.hot .mk{color:var(--accent);border-color:var(--accent)}
  .stp .bd{padding-top:10px;min-width:0}
  .stp .bd h4{font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;line-height:1.25}
  .stp.hot .bd h4{color:var(--ink)}
  .stp .bd p{color:var(--muted);font-size:13.5px;line-height:1.55;margin-top:6px;max-width:600px}
  .stp .tag{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff);padding:3px 7px;border-radius:6px}
  /* completion node */
  .stp.fin .mk{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 12px 24px -12px var(--accent)}
  .stp.fin .bd .lead{display:block;font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .stp.fin .bd h4{color:var(--ink);font-weight:700}
  .loop-exit{
    display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 8%,#fff);border:1px solid color-mix(in srgb,var(--accent) 24%,#fff);
    border-radius:12px;padding:11px 14px;
  }
  .loop-exit svg{flex:none}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fadein{to{opacity:1}}
  @keyframes drawArc{to{stroke-dashoffset:0}}
  @keyframes drawLine{to{stroke-dashoffset:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes dashspin{to{transform:rotate(-360deg)}}
  @keyframes growUp{to{transform:scaleY(1)}}
  @keyframes pop{to{opacity:1;transform:scale(1)}}

  /* ---------- Stage body: signature diagram + steps ---------- */
  .stage-body{display:grid;grid-template-columns:minmax(290px,.92fr) minmax(330px,1.08fr);gap:36px;align-items:start;margin-top:6px}
  @media(max-width:940px){.stage-body{grid-template-columns:1fr;gap:26px}}
  .stage-body .steps{max-width:none;margin-top:2px;order:1}
  .stage-body .diagram{order:2}
  .diagram{position:relative;min-width:0}
  .dgm-title{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .dgm{width:100%;height:auto;overflow:visible;display:block}
  .dgm text{font-family:inherit}
  .dgm .axis{stroke:var(--line);stroke-width:1.5}
  .dgm .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
  .dgm .axt{fill:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .dgm .ql{font-size:12.5px;font-weight:800;letter-spacing:.01em}
  .dgm .qs{font-size:9.5px;font-weight:600;fill:var(--faint)}
  .dgm .nl{font-size:11px;font-weight:700;fill:var(--ink)}
  .dgm .nsub{font-size:9px;font-weight:700;letter-spacing:.03em}
  .dgm .val{font-size:10px;font-weight:700;fill:var(--ink)}
  .dgm .a-fill{fill:var(--accent)}
  .dgm .a-stroke{stroke:var(--accent);fill:none}
  .dgm .a-tint{fill:color-mix(in srgb,var(--accent) 15%,#fff)}
  .dgm .a-tint2{fill:color-mix(in srgb,var(--accent) 7%,#fff)}
  .dgm .a-text{fill:var(--accent)}
  .dgm .a-line{stroke:var(--accent);fill:none}
  .dgm .line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .screen.active .dgm .draw{animation:drawLine 1.15s ease forwards}
  .dgm .draw{stroke-dasharray:100;stroke-dashoffset:100}
  .screen.active .dgm .bar{animation:growUp .75s cubic-bezier(.2,.7,.3,1) forwards}
  .dgm .bar{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom}
  .screen.active .dgm .pop{animation:pop .5s cubic-bezier(.2,.7,.3,1) forwards}
  .dgm .pop{opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center}
  .dgm-cap{margin-top:16px;font-size:12.5px;line-height:1.55;color:var(--muted);border-left:3px solid var(--accent);padding-left:13px}
  .dgm-cap b{color:var(--ink);font-weight:600}
  .dgm-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .dgm-chips span{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .dgm-chips i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

  /* ---------- Stage 5 loop ---------- */
  .calib{display:grid;grid-template-columns:1fr minmax(300px,400px);gap:30px;align-items:start}
  @media(max-width:860px){.calib{grid-template-columns:1fr;justify-items:center}}
  @media(min-width:861px){.calib>.loop{position:sticky;top:6px}}
  .calib-detail{gap:12px;order:1}
  .calib>.loop{order:2}
  .loop{position:relative;width:min(100%,300px);margin:0 auto;aspect-ratio:344/280}

  /* stage 5: eval-journey convergence chart, paired with the loop */
  .evals{margin-top:8px}
  .evals-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .evals-sub{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .evals-legend{display:flex;gap:14px;font-size:10.5px;font-weight:700;color:var(--muted);align-items:center}
  .evals-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
  .evals-legend .acc{background:var(--accent)}
  .evals-legend .prc{background:var(--mock)}
  .evals .target{stroke:#AEB6CC;stroke-width:1.3;stroke-dasharray:5 5;fill:none}
  .evals .tgt-lab{fill:var(--faint);font-size:9.5px;font-weight:800;letter-spacing:.08em}
  .evals .line{stroke-width:2.4}

  /* loop-synced eval cycle: comet 4s × 8 laps = 32s; dots appear at end of laps 1-7, hold then reset */
  @keyframes evd1{0%,11%{opacity:0;transform:scale(.3)}13%,95%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
  @keyframes evd2{0%,23%{opacity:0;transform:scale(.3)}25%,95%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
  @keyframes evd3{0%,36%{opacity:0;transform:scale(.3)}38%,95%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
  @keyframes evd4{0%,48%{opacity:0;transform:scale(.3)}50%,95%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
  @keyframes evd5{0%,61%{opacity:0;transform:scale(.3)}63%,95%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
  @keyframes evd6{0%,73%{opacity:0;transform:scale(.3)}75%,95%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
  @keyframes evd7{0%,86%{opacity:0;transform:scale(.3)}88%,95%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
  @keyframes evline{
    0%,12.5%{stroke-dashoffset:100;opacity:1}
    25%{stroke-dashoffset:83.33}
    37.5%{stroke-dashoffset:66.67}
    50%{stroke-dashoffset:50}
    62.5%{stroke-dashoffset:33.33}
    75%{stroke-dashoffset:16.67}
    87.5%,96%{stroke-dashoffset:0;opacity:1}
    100%{stroke-dashoffset:0;opacity:0}
  }
  .evals .evdot{transform-box:fill-box;transform-origin:center;opacity:0}
  .evals .evline{stroke-dasharray:100;stroke-dashoffset:100}
  .screen.active .evals .evd1{animation:evd1 32s linear infinite}
  .screen.active .evals .evd2{animation:evd2 32s linear infinite}
  .screen.active .evals .evd3{animation:evd3 32s linear infinite}
  .screen.active .evals .evd4{animation:evd4 32s linear infinite}
  .screen.active .evals .evd5{animation:evd5 32s linear infinite}
  .screen.active .evals .evd6{animation:evd6 32s linear infinite}
  .screen.active .evals .evd7{animation:evd7 32s linear infinite}
  .screen.active .evals .evline{animation:evline 32s linear infinite}
  .loop svg{width:100%;height:100%;overflow:visible;transform:rotate(0deg)}
  .loop .seg{fill:none;stroke-width:30;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
  .screen.active .loop .seg{animation:drawArc .9s ease forwards}
  .screen.active .loop .segA{animation-delay:.15s}
  .screen.active .loop .segB{animation-delay:.5s}
  .screen.active .loop .segC{animation-delay:.85s}

  /* outer cycle - visible track + travelling comet (the loop never stops) */
  .loop .cyc-track{fill:none;stroke:#B4BCD2;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:0.5 8.5;opacity:0}
  .screen.active .loop .cyc-track{opacity:1;transition:opacity .5s ease .9s}
  .loop .cyc-run{fill:none;stroke:var(--accent);stroke-width:3.6;stroke-linecap:round;transform-origin:120px 120px;opacity:0}
  .loop .cyc-head{fill:var(--accent);transform-origin:120px 120px;opacity:0}
  .screen.active .loop .cyc-run,
  .screen.active .loop .cyc-head{animation:fadein .5s ease .9s forwards, spin 4s linear infinite}

  /* stage labels - now outside the ring, reading on the light background */
  .loop .slbl{opacity:0}
  .screen.active .loop .slbl{animation:fadein .5s ease forwards}
  .screen.active .loop .slblA{animation-delay:.55s}
  .screen.active .loop .slblB{animation-delay:.9s}
  .screen.active .loop .slblC{animation-delay:1.2s}
  .loop .slbl .disc{stroke:#fff;stroke-width:2}
  .loop .slbl .idx{font-size:12.5px;font-weight:800;fill:#fff}
  .loop .slbl .word{font-size:12px;font-weight:800;letter-spacing:.06em}

  /* hub */
  .loop .hub-plate{fill:#fff;filter:url(#hubShadow)}
  .loop .hub-title{font-size:13px;font-weight:800;letter-spacing:.07em;fill:var(--ink)}
  .loop .hub-sub{font-size:11px;font-weight:600;fill:var(--muted)}

  .calib-detail{display:grid;gap:14px;width:100%}
  .dcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm)}
  .dcard .dh{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.01em}
  .dcard .chip{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none}
  .dcard ul{list-style:none;margin-top:10px;display:grid;gap:7px}
  .dcard li{position:relative;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.45}
  .dcard li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--c)}
  .dcard li b{color:var(--ink);font-weight:600}

  /* ---------- Closing: the compounding staircase ---------- */
  .close{display:flex;flex-direction:column;gap:clamp(16px,2.6vh,26px)}
  .close-head{display:flex;align-items:flex-start;gap:15px;max-width:880px}
  .close-head .ic{width:46px;height:46px;border-radius:13px;flex:none;background:linear-gradient(135deg,var(--roadmap),var(--mock),var(--prove));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-sm)}
  .close-head h2{font-size:clamp(23px,3.2vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.06}
  .close-lede{color:var(--muted);font-size:clamp(14px,1.6vw,16.5px);line-height:1.55;margin-top:7px}
  .close-lede b{color:var(--ink);font-weight:600}

  .stair{width:100%;max-width:920px;margin:0 auto}
  .stair svg{width:100%;height:auto;overflow:visible;display:block}
  .stair-axis{stroke:var(--line);stroke-width:1.5}
  .stair-ax{fill:var(--faint);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .stair-step{opacity:0;transform:translateY(10px)}
  .screen.active .stair-step{animation:rise .55s cubic-bezier(.2,.7,.3,1) forwards}
  .stair-step .step-bar{filter:drop-shadow(0 9px 14px rgba(16,18,43,.16))}
  .step-num{font-size:15px;font-weight:800}
  .step-key{font-size:12.5px;font-weight:800;fill:var(--ink);letter-spacing:-.01em}
  .step-out{font-size:9.5px;font-weight:600;fill:var(--faint);letter-spacing:.02em}
  .stair-line{fill:none;stroke:var(--epam);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
  .screen.active .stair-line{animation:drawLine 1.2s ease .9s forwards}
  .stair-tip{fill:var(--epam);opacity:0}
  .screen.active .stair-tip{animation:fadein .4s ease 2s forwards}
  .stair-note{fill:var(--epam);font-size:12px;font-weight:800;letter-spacing:.03em;opacity:0}
  .screen.active .stair-note{animation:fadein .5s ease 1.7s forwards}

  .benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
  @media(max-width:900px){.benefits{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:500px){.benefits{grid-template-columns:1fr}}
  .bcard{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow-sm);opacity:0;transform:translateY(10px)}
  .bcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc,var(--epam))}
  .screen.active .bcard{animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
  .bcard .bic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--bc,var(--epam));margin-bottom:10px}
  .bcard h4{font-size:14px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  .bcard p{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}

  /* ---------- Value-chain AI maturity map ---------- */
  .vcm{display:flex;flex-direction:column;gap:13px}
  .vcm-eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--epam)}
  .vcm-intro{font-size:13.5px;color:var(--muted);line-height:1.5;max-width:780px;margin-top:-2px}
  .vcm-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .vcm-tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:.18s}
  .vcm-tab:hover{border-color:var(--epam);color:var(--ink)}
  .vcm-tab.on{background:var(--epam);border-color:var(--epam);color:#fff;box-shadow:0 10px 22px -14px var(--epam)}
  .vcm-body{opacity:0;animation:fadein .45s ease forwards;display:flex;flex-direction:column;gap:13px}

  .vcm-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 24px}
  .vcm-head > div:not(.vcm-kpi){flex:1 1 340px;min-width:0}
  .vcm-head h2{font-size:clamp(19px,2.5vw,26px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .vcm-head .sub{font-size:13px;color:var(--muted);margin-top:5px;max-width:660px;line-height:1.5}
  .vcm-kpi{flex:none;margin-left:auto;text-align:right;min-width:200px}
  .vcm-kpi .pct{font-size:34px;font-weight:800;color:#1BA877;line-height:1;letter-spacing:-.02em}
  .vcm-kpi .lab{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:3px}
  .vcm-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line);margin-top:9px}
  .vcm-bar i{height:100%}
  .vcm-counts{font-size:11px;color:var(--muted);margin-top:6px}
  .vcm-counts b{color:var(--ink);font-weight:700}

  .vcm-grid{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
  .vcm-col{flex:1 1 0;min-width:112px;display:flex;flex-direction:column;gap:5px}
  .vcm-col-h{background:var(--epam);color:#fff;font-size:11px;font-weight:700;line-height:1.18;padding:8px 9px;border-radius:9px;min-height:44px;display:flex;align-items:center}
  .vcm-cell{font-size:10.5px;line-height:1.18;font-weight:600;padding:7px 8px 7px 9px;border-radius:8px;border:1px solid;border-left-width:4px}
  .vcm-cell.f{background:color-mix(in srgb,#1BA877 13%,#fff);border-color:color-mix(in srgb,#1BA877 30%,#fff);border-left-color:#1BA877;color:#0B5A3F}
  .vcm-cell.p{background:color-mix(in srgb,#2D5BD7 10%,#fff);border-color:color-mix(in srgb,#2D5BD7 26%,#fff);border-left-color:#2D5BD7;color:#22357F}
  .vcm-cell.n{background:#F1F3F8;border-color:var(--line);border-left-color:#AEB6CC;color:var(--faint)}

  .vcm-panels{display:grid;grid-template-columns:1.12fr .88fr;gap:13px}
  .vcm-panels.stack{grid-template-columns:1fr}
  @media(max-width:820px){.vcm-panels{grid-template-columns:1fr}}
  .vcm-panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
  .vcm-panel h3{font-size:13px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .vcm-panel h3 span{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .vcm-caps{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px;margin-top:12px}
  @media(max-width:560px){.vcm-caps{grid-template-columns:1fr}}
  .vcm-cap{border-left:3px solid var(--epam);padding-left:10px}
  .vcm-cap h4{font-size:12.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  .vcm-cap p{font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px}
  .vcm-plat{margin-top:11px;display:flex;flex-direction:column;gap:8px}
  .vcm-plat .row{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:baseline}
  .vcm-plat .a{font-size:11.5px;font-weight:700;color:var(--ink)}
  .vcm-plat .t{font-size:11.5px;color:var(--epam);font-weight:600;line-height:1.35}

  .vcm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  @media(max-width:700px){.vcm-stats{grid-template-columns:1fr}}
  .vcm-stat{background:color-mix(in srgb,var(--epam) 5%,#fff);border:1px solid color-mix(in srgb,var(--epam) 16%,#fff);border-radius:12px;padding:11px 14px;display:flex;gap:11px;align-items:baseline}
  .vcm-stat b{font-size:14.5px;font-weight:800;color:var(--epam);white-space:nowrap}
  .vcm-stat span{font-size:11px;color:var(--muted);line-height:1.4}
  .vcm-legend{display:flex;flex-wrap:wrap;gap:18px;align-items:center;font-size:11.5px;color:var(--muted);padding-top:2px}
  .vcm-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:7px;vertical-align:-1px;border:1px solid}
  .vcm-legend .f{background:color-mix(in srgb,#1BA877 18%,#fff);border-color:#1BA877}
  .vcm-legend .p{background:color-mix(in srgb,#2D5BD7 16%,#fff);border-color:#2D5BD7}
  .vcm-legend .n{background:#F1F3F8;border-color:#AEB6CC}

  /* ---------- Footer nav ---------- */
  footer{
    display:flex;align-items:center;gap:14px;flex:none;
    padding:14px clamp(16px,4vw,40px);border-top:1px solid var(--line);
    background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(140%) blur(10px);backdrop-filter:saturate(140%) blur(10px);
  }
  .dots{display:flex;gap:8px;margin:0 auto}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
  .dots i.on{background:var(--accent);transform:scale(1.25)}
  .btn{
    border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:600;font-size:14px;
    padding:11px 20px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:.18s;
  }
  .btn:hover{border-color:var(--accent)}
  .btn[disabled]{opacity:.35;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 12px 24px -14px var(--accent)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn svg{width:17px;height:17px}
  .hint{font-size:11.5px;color:var(--faint);flex:none}
  @media(max-width:640px){.hint{display:none}}

  /* ---------- Stage 4 drill-down: "the cost model" (opt-in overlay) ---------- */
  .deeper-cta{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    width:100%;margin-top:22px;padding:15px 20px;border-radius:16px;cursor:pointer;font:inherit;text-align:left;
    background:color-mix(in srgb,var(--accent) 8%,#fff);
    border:1px solid color-mix(in srgb,var(--accent) 26%,#fff);color:var(--ink);transition:.18s;
  }
  .deeper-cta:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .deeper-cta .dc-tx{min-width:0}
  .deeper-cta .dc-t{font-size:14.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  .deeper-cta .dc-s{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:500;line-height:1.4}
  .deeper-cta .dc-go{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;flex:none}

  .drill{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    background:rgba(247,248,252,.9);-webkit-backdrop-filter:saturate(140%) blur(16px);backdrop-filter:saturate(140%) blur(16px);
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility .35s;
  }
  .drill.open{opacity:1;visibility:visible;pointer-events:auto}
  .drill-top{display:flex;align-items:center;gap:16px;flex:none;padding:13px clamp(16px,4vw,40px);
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.72)}
  .drill-eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);flex:none}
  .drill-prog{display:flex;gap:7px;align-items:center;margin:0 auto}
  .drill-prog i{width:26px;height:4px;border-radius:2px;background:var(--line);transition:.3s}
  .drill-prog i.on{background:var(--accent);width:36px}
  /* cost-model stepper - same pill idiom as the main header, scoped to the overlay accent */
  .drill-nav{display:flex;gap:6px;align-items:center;justify-content:center;margin:0 auto;flex-wrap:wrap}
  .drill-step{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);
    border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);transition:.2s;line-height:1}
  .drill-step:hover{border-color:var(--accent);color:var(--ink)}
  .drill-step .dnum{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--faint);font-size:11px;font-weight:700;transition:.2s;flex:none}
  .drill-step.done .dnum{background:var(--accent);color:#fff}
  .drill-step.current{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 9%,#fff)}
  .drill-step.current .dnum{background:var(--accent);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
  @media(max-width:640px){.drill-step .dlbl{display:none}}
  .d-close{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--muted);
    font:inherit;font-weight:600;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.18s;flex:none}
  .d-close:hover{border-color:var(--accent);color:var(--ink)}

  .drill-body{position:relative;flex:1;overflow:hidden}
  .drill-screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    padding:clamp(16px,3vh,38px) clamp(18px,5vw,56px);
    opacity:0;visibility:hidden;transform:translateY(14px);
    transition:opacity .45s ease,transform .45s ease,visibility .45s}
  .drill-screen.active{opacity:1;visibility:visible;transform:none}
  .drill-inner{max-width:1000px;margin:0 auto;width:100%}
  .drill-head .of{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .drill-head h2{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.08;margin-top:4px}
  .drill-lede{font-size:clamp(14px,1.6vw,17px);color:var(--muted);line-height:1.5;margin:12px 0 18px;max-width:720px}
  .drill-lede b{color:var(--ink);font-weight:600}
  .drill-grid{display:grid;grid-template-columns:minmax(300px,1.05fr) minmax(300px,.95fr);gap:34px;align-items:start}
  @media(max-width:900px){.drill-grid{grid-template-columns:1fr;gap:24px}}
  .drill-grid.two-dgm{grid-template-columns:1fr 1fr;gap:24px}
  @media(max-width:820px){.drill-grid.two-dgm{grid-template-columns:1fr}}

  /* re-trigger the shared .dgm animation primitives inside an active drill screen */
  .drill-screen.active .dgm .draw{animation:drawLine 1.15s ease forwards}
  .drill-screen.active .dgm .bar{animation:growUp .75s cubic-bezier(.2,.7,.3,1) forwards}
  .drill-screen.active .dgm .pop{animation:pop .5s cubic-bezier(.2,.7,.3,1) forwards}

  /* layered "show the arithmetic" reveal */
  .reveal-btn{display:inline-flex;align-items:center;gap:9px;margin-top:16px;border:1px dashed color-mix(in srgb,var(--accent) 45%,#fff);
    background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:11px;cursor:pointer;transition:.18s}
  .reveal-btn:hover{border-style:solid}
  .reveal-btn svg{transition:transform .25s}
  .reveal-btn.on svg{transform:rotate(180deg)}
  .reveal{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s ease,opacity .35s ease,margin .4s ease}
  .reveal.show{max-height:720px;opacity:1;margin-top:14px}
  .reveal-card{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow-sm)}
  .reveal-card .frm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:2px 0 12px;overflow-x:auto}
  .reveal-card ul{list-style:none;display:grid;gap:7px}
  .reveal-card li{position:relative;padding-left:17px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .reveal-card li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .reveal-card li b{color:var(--ink);font-weight:700}
  .reveal-note{font-size:11px;color:var(--faint);margin-top:11px;font-style:italic}

  .drill-foot{display:flex;align-items:center;gap:14px;flex:none;padding:13px clamp(16px,4vw,40px);
    border-top:1px solid var(--line);background:rgba(255,255,255,.72)}
  .drill-onward{display:inline-flex;align-items:center;gap:9px;margin:0 auto;font-size:12.5px;font-weight:600;color:var(--muted)}
  .drill-onward a{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:none;border-bottom:1.5px solid color-mix(in srgb,var(--accent) 40%,#fff)}
  .drill-onward a:hover{border-bottom-color:var(--accent)}

  /* routing animation: task stream + two diverging cost meters */
  .route-wrap{margin-top:6px}
  .drill-sub{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 0 6px;max-width:470px}
  .drill-sub b{color:var(--ink);font-weight:600}
  .route-canvas{display:block;width:100%;height:auto;margin-top:4px}
  .route-meters{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:14px}
  @media(max-width:620px){.route-meters{grid-template-columns:1fr;gap:9px}}
  .rmeter{display:flex;flex-direction:column;gap:3px;padding:11px 15px;border:1px solid var(--line);border-radius:13px;background:var(--paper)}
  .rmeter.leg{border-left:3px solid #AEB6CC}
  .rmeter.cas{border-left:3px solid var(--accent);align-items:flex-end;text-align:right}
  .rmeter.mid{border:0;background:none;align-items:center;text-align:center;gap:1px}
  .rmk{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .rmv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
  .rmeter.cas .rmv{color:var(--accent)}
  .rmeter.mid .rmk{color:var(--muted)}
  .rmv.save{font-family:inherit;font-size:30px;font-weight:800;color:#1BA877}
  .route-meters.compact{gap:8px;margin-top:10px}
  .route-meters.compact .rmeter{padding:8px 11px;border-radius:11px}
  .route-meters.compact .rmk{font-size:9px}
  .route-meters.compact .rmv{font-size:16px}
  .route-meters.compact .rmv.save{font-size:19px}
  .two-levers{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}

  /* ---------- Framework hero: waves → phase circles → road ---------- */
  .screen.cover{justify-content:safe start;padding-top:clamp(14px,3vh,34px)}
  .pchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .pchip{font-size:11.5px;font-weight:700;color:var(--epam);background:color-mix(in srgb,var(--epam) 7%,#fff);
    border:1px solid color-mix(in srgb,var(--epam) 20%,#fff);border-radius:999px;padding:5px 13px}
  .fw{width:100%;max-width:1000px;margin:clamp(14px,2.4vh,26px) auto 4px}
  .fw svg{width:100%;height:auto;overflow:visible;display:block}
  .fw-prin{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;fill:var(--faint)}
  .fw-wave{fill:none;stroke-width:2.6;stroke-linecap:round;opacity:.9;stroke-dasharray:340;stroke-dashoffset:340}
  .screen.active .fw-wave{animation:drawLine 1.3s ease forwards}
  .fw-bundle{stroke:#C7CCDB;stroke-width:2.4;opacity:0}
  .screen.active .fw-bundle{animation:fadein .5s ease .8s forwards}
  .fw-circ{opacity:0;transform:scale(.86);transform-box:fill-box;transform-origin:center}
  .screen.active .fw-circ{animation:pop .55s cubic-bezier(.2,.7,.3,1) forwards}
  .fw-ctitle{font-size:15px;font-weight:800;letter-spacing:.02em}
  .fw-cout{font-size:9.5px;font-weight:700;fill:var(--faint)}
  .fw-road{fill:none;stroke:#5BA845;stroke-width:6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
  .screen.active .fw-road{animation:drawArc 1.1s ease 1.3s forwards}
  .fw-road-tip{fill:#5BA845;opacity:0}
  .screen.active .fw-road-tip{animation:fadein .4s ease 2.3s forwards}
  .fw-road-lab{font-size:11px;font-weight:800;letter-spacing:.03em;fill:#4E9A3E}
  .fw-band{opacity:0}
  .screen.active .fw-band{animation:fadein .6s ease 1.5s forwards}
  /* journey as a responsive grid of the seven nodes */

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
    .stp,.loop .slbl,.loop .cyc-track,.loop .cyc-run,.loop .cyc-head,

  const chips = ['Business-driven','Human-centered','ROI-informed','AI-accelerated']
    .map(c=>`<span class="pchip">${c}</span>`).join('');

const stripStrong = h => h.replace(/<[^>]+>/g,'');

  return `

      <path class="seg segB" pathLength="100" stroke="var(--mock)"    d="M124.39,36.12 A84,84 0 0 1 194.85,158.13"/>
      <path class="seg segC" pathLength="100" stroke="var(--prove)"   d="M190.45,165.75 A84,84 0 0 1 49.55,165.75"/>

      <!-- hub: centred ADJUST + sub-text -->
      <circle class="hub-plate" cx="120" cy="120" r="54"/>
      <text class="hub-title" x="120" y="110" text-anchor="middle">ADJUST</text>
      <text class="hub-sub" x="120" y="124" text-anchor="middle">repeat until</text>
      <text class="hub-sub" x="120" y="137" text-anchor="middle">targets met</text>

      <!-- labels, outside the ring and clear of the cycle track, coloured to their segment -->
      <g class="slbl slblA">
        <circle class="disc" cx="12.61" cy="58" r="10" fill="var(--roadmap)"/>
        <text class="idx" x="12.61" y="62" text-anchor="middle">1</text>
        <text class="word" x="-6.44" y="47" text-anchor="middle" fill="#6A4FCB">ROADMAP</text>
      </g>
      <g class="slbl slblB">

        <text class="idx" x="227.39" y="62" text-anchor="middle">2</text>
        <text class="word" x="246.44" y="47" text-anchor="middle" fill="#2550C4">MOCK AGENT</text>
      </g>
      <g class="slbl slblC">
        <circle class="disc" cx="120" cy="244" r="10" fill="var(--prove)"/>

/* ---------- closing: the compounding staircase ---------- */
function closeHTML(idx){
  const N=stages.length, baseY=286, x0=70, stepW=104, gap=12;
  const topHi=44, topLo=244, span=(topLo-topHi)/(N-1);
  const outs=['Approved stack','Use cases found','Agents designed','Made compliant','ROI proven','Value calibrated','Live & improving'];
  let steps='', linePts=[];
  stages.forEach((s,k)=>{
    const x=x0+k*(stepW+gap), cx=x+stepW/2, ty=topLo-k*span, h=baseY-ty;
    linePts.push(`${cx.toFixed(1)},${(ty-6).toFixed(1)}`);
    steps += `
      <g class="stair-step" style="animation-delay:${(0.15+k*0.11).toFixed(2)}s">
        <rect class="step-bar" x="${x}" y="${ty.toFixed(1)}" width="${stepW}" height="${h.toFixed(1)}" rx="9" fill="${s.color}"/>
        <circle cx="${cx}" cy="${(ty+22).toFixed(1)}" r="14" fill="#fff"/>
        <text class="step-num" x="${cx}" y="${(ty+27).toFixed(1)}" text-anchor="middle" fill="${s.color}">${s.n}</text>
        <text class="step-key" x="${cx}" y="${baseY+22}" text-anchor="middle">${s.key}</text>
        <text class="step-out" x="${cx}" y="${baseY+35}" text-anchor="middle">${outs[k]}</text>
      </g>`;
  });
  const lastCx = x0+(N-1)*(stepW+gap)+stepW/2;
  const tipEnd = `${(lastCx+34).toFixed(1)},${(topHi-14).toFixed(1)}`;
  const benefits=[
    {c:'#8453D2', ic:I.layers,  t:'Evidence-based use-case discovery', d:'Use cases are prioritised from the EPAM Salesforce scan, then grounded in lived vs. documented processes and tacit knowledge — scope sits on real friction, not stakeholder assumptions.'},
    {c:'#0078C2', ic:I.shield,  t:'Governance embedded at design', d:'AI regulatory risk classification (EU AI Act, US EO, UK DSIT), data privacy (GDPR, CCPA, PIPEDA), RBAC and audit logging are built into the solution design — not bolted on at the end.'},
    {c:'#0E9488', ic:I.refresh, t:'Prove value before full build', d:'Agents are prototyped on synthetic data, embedded in real workflows and tested for accuracy and cost — iterating until ROI is proven.'},
    {c:'#5BA845', ic:I.trend,   t:'Dynamic, cost-validated business case', d:'ROI is continuously recalculated from real unit-task costs and consumption economics found during prototyping, so priorities shift on evidence.'}
  ];
  const bcards = benefits.map((b,i)=>`
    <div class="bcard" style="--bc:${b.c};animation-delay:${(1.5+i*0.13).toFixed(2)}s">
      <span class="bic">${svg(b.ic,17)}</span>
      <h4>${b.t}</h4>
      <p>${b.d}</p>
    </div>`).join('');
  return `<section class="screen" data-i="${idx}" style="--accent:var(--epam)">
    <div class="inner close">
      <div class="close-head">
        <div class="ic">${svg(I.spark,24)}</div>
        <div>
          <h2>Benefits of the approach</h2>
          <p class="close-lede">Start at the correct stage and each node stacks on the last — from an approved foundation to live, improving agents. <b>Four benefits keep the value compounding</b>, so the gains build rather than reset.</p>
        </div>
      </div>
      <div class="stair">
        <svg viewBox="0 0 900 338" role="img" aria-label="Staircase of Phase 0 and the six stages rising to live, compounding value">
          <line class="stair-axis" x1="70" y1="22" x2="70" y2="286"/>
          <line class="stair-axis" x1="70" y1="286" x2="888" y2="286"/>
          <text class="stair-ax" x="56" y="150" text-anchor="middle" transform="rotate(-90 56 150)">Value delivered</text>
          ${steps}
          <polyline class="stair-line" pathLength="100" points="${linePts.join(' ')} ${tipEnd}"/>
          <polygon class="stair-tip" points="${(lastCx+42).toFixed(1)},${(topHi-18).toFixed(1)} ${(lastCx+30).toFixed(1)},${(topHi-6).toFixed(1)} ${(lastCx+26).toFixed(1)},${(topHi-21).toFixed(1)}"/>
          <text class="stair-note" x="${(lastCx-10).toFixed(1)}" y="22" text-anchor="end">value keeps compounding</text>
        </svg>
      </div>
      <div class="benefits">${bcards}</div>
    </div>
  </section>`;
}

/* ---------- Stage 4 drill-down: "the cost model" (opt-in overlay) ---------- */
/* Diagram 1 - the N² accumulation curve vs a linear baseline */
function dgmN2(){
  const N=10, base=4000, d=1500;
  const tok=n=>base*n+d*n*(n-1)/2, lin=n=>base*n, maxV=tok(N);
  const X=n=>60+(n-1)/(N-1)*370, Y=v=>250-v/maxV*200;
  const ns=[...Array(N)].map((_,i)=>i+1);
  const quad=ns.map(n=>`${X(n).toFixed(1)},${Y(tok(n)).toFixed(1)}`).join(' ');
  const line=ns.map(n=>`${X(n).toFixed(1)},${Y(lin(n)).toFixed(1)}`).join(' ');
  const area=`60,250 ${quad} ${X(N).toFixed(1)},250`;
  const mk=(n,lab)=>`<circle class="a-fill pop" cx="${X(n).toFixed(1)}" cy="${Y(tok(n)).toFixed(1)}" r="5" style="animation-delay:${(1+n*0.03).toFixed(2)}s"/>
    <text class="val" x="${X(n).toFixed(1)}" y="${(Y(tok(n))-9).toFixed(1)}" text-anchor="middle">${lab}</text>`;
  return `
<div class="diagram">
  <div class="dgm-title">One task → many calls → N² cost</div>
  <svg class="dgm" viewBox="0 0 460 290" role="img" aria-label="Cumulative input tokens growing with the square of the turn count">
    <polygon points="${area}" class="a-tint" style="opacity:0;animation:fadein .7s ease .9s forwards"/>
    <polyline class="line draw" points="${line}" stroke="#8990A6" stroke-dasharray="4 5" pathLength="100"/>
    <polyline class="line a-line draw" points="${quad}" pathLength="100" style="animation-delay:.3s"/>
    <text x="424" y="${(Y(lin(N))-6).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="#6A7088">linear (no re-reads)</text>
    ${mk(3,'easy')}${mk(6,'medium')}${mk(10,'hard')}
    <line class="axis" x1="60" y1="40" x2="60" y2="250"/>
    <line class="axis" x1="60" y1="250" x2="436" y2="250"/>
    <text class="axt" x="248" y="270" text-anchor="middle">Turns per task (N) →</text>
    <text class="axt" x="48" y="145" text-anchor="middle" transform="rotate(-90 48 145)">Cumulative input tokens →</text>
  </svg>
  <div class="dgm-cap">The agent re-sends its <b>whole conversation history every step</b>, so cost grows rapidly as tasks get longer. A "hard" task that takes 3.3× more steps ends up burning ~9× the tokens of an "easy" one.</div>
</div>`;}

/* Diagram 2a - caching collapses the coefficient */
function dgmCache(){
  const XC=n=>70+(n-1)/9*348, full=n=>(n*n)/100, cached=n=>(n+n*n*0.1)/100, YC=v=>236-v*196;
  const ns=[...Array(10)].map((_,i)=>i+1);
  const pf=ns.map(n=>`${XC(n).toFixed(1)},${YC(full(n)).toFixed(1)}`).join(' ');
  const pc=ns.map(n=>`${XC(n).toFixed(1)},${YC(cached(n)).toFixed(1)}`).join(' ');
  const band=`${pf} ${ns.slice().reverse().map(n=>`${XC(n).toFixed(1)},${YC(cached(n)).toFixed(1)}`).join(' ')}`;
  return `
<div class="diagram">
  <div class="dgm-title">Caching · collapse the coefficient</div>
  <svg class="dgm" viewBox="0 0 460 272" role="img" aria-label="Caching flattens the cost curve by serving the repeating prefix cheaply">
    <polygon points="${band}" class="a-tint" style="opacity:0;animation:fadein .7s ease 1s forwards"/>
    <polyline class="line draw" points="${pf}" stroke="#AEB6CC" style="stroke-width:2.6" pathLength="100"/>
    <polyline class="line a-line draw" points="${pc}" style="stroke-width:2.8;animation-delay:.35s" pathLength="100"/>
    <text x="426" y="54" text-anchor="end" font-size="11" font-weight="700" fill="#6A7088">full price</text>
    <text class="a-text" x="426" y="194" text-anchor="end" font-size="11" font-weight="800">cached ~10%</text>
    <line class="axis" x1="52" y1="34" x2="52" y2="236"/>
    <line class="axis" x1="52" y1="236" x2="430" y2="236"/>
    <text class="axt" x="241" y="258" text-anchor="middle">Turns →</text>
  </svg>
  <div class="dgm-cap">The repeating prefix is served from cache at <b>~10% of input price</b>, so only the new tokens each turn pay full price — the parabola flattens toward linear.</div>

function drillHTML(id, dd){
  const backIc = svg('<polyline points="15 18 9 12 15 6"/>',16);
  const screens = dd.screens.map((d,i)=>`
    <section class="drill-screen${i===0?' active':''}" data-di="${i}">
      <div class="drill-inner">
        <div class="drill-head"><div class="of">${d.of}</div><h2>${d.title}</h2></div>
        <p class="drill-lede">${d.lede}</p>
        ${d.grid}
      </div>
    </section>`).join('');
  const pills = dd.screens.map((d,i)=>`<button class="drill-step${i===0?' current':''}" data-dgo="${i}" type="button">
      <span class="dnum">${i+1}</span><span class="dlbl">${d.nav}</span></button>`).join('');
  return `<div class="drill" id="drill-${id}" data-drill="${id}" aria-hidden="true" style="--accent:${dd.accent};--accent-soft:${dd.accentSoft}">
    <div class="drill-top">
      <span class="drill-eyebrow">${dd.eyebrow}</span>
      <nav class="drill-nav" aria-label="${dd.eyebrow} steps">${pills}</nav>
      <button class="d-close" data-dclose type="button">${backIc}${dd.back}</button>
    </div>
    <div class="drill-body">${screens}</div>
    <div class="drill-foot">
      <button class="btn d-prev" type="button">${backIc}Back</button>
      <span class="hint" style="margin:0 auto">Esc to exit · ← → to move</span>
      <button class="btn primary d-next" type="button">Next ${svg('<polyline points="9 18 15 12 9 6"/>',16)}</button>
    </div>
  </div>`;
}

/* ---------- assemble ---------- */
const wrap = document.getElementById('wrap');
let html = overviewHTML();
stages.forEach((s,i)=>{ html += stageHTML(s,i+1); });
html += closeHTML(stages.length+1);
html += maturityHTML(stages.length+2);
html += finopsHTML(stages.length+3);
wrap.innerHTML = html;
renderMaturity('banking');
renderFinops('model');
Object.entries(drilldowns).forEach(([id,dd])=> document.body.insertAdjacentHTML('beforeend', drillHTML(id,dd)));

const TOTAL = stages.length+4; // overview + 6 + closing + maturity + FinOps (indices 0..9)
const screens = [...wrap.querySelectorAll('.screen')];

/* stepper */
const stepper = document.getElementById('stepper');
stepper.innerHTML = stages.map((s,k)=>
  `<button class="step" data-go="${k+1}" style="--s-color:${s.color}">
     <span class="num">${s.n}</span><span class="lbl">${s.key}</span>
   </button>`).join('');

/* dots */
const dots = document.getElementById('dots');
dots.innerHTML = screens.map((_,i)=>`<i data-go="${i}"></i>`).join('');

/* appendix navigator - non-stage / reference screens. Add an entry per new appendix screen. */
const appendices = [
  { label:'Maturity Map', desc:'The framework applied across an industry value chain', icon:I.grid,  color:'#001965', i:stages.length+2 },
  { label:'AI FinOps',    desc:'Governing the cost of agentic AI',                      icon:I.coins, color:'#1593B6', i:stages.length+3 }
];
const apx = document.getElementById('apx');
apx.innerHTML = `
  <button class="apx-btn" id="apxBtn" aria-haspopup="true" aria-expanded="false" aria-controls="apxMenu">
    ${svg(I.book,16)}<span class="apx-lbl">Appendices</span>
    <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
  <div class="apx-menu" id="apxMenu" role="menu" aria-label="Reference sections">
    <div class="apx-hd">Beyond the six stages</div>
    ${appendices.map(a=>`<button class="apx-item" role="menuitem" data-go="${a.i}">
      <span class="apx-ic" style="background:${a.color}">${svg(a.icon,17)}</span>
      <span class="apx-t">${a.label}</span>
      <span class="apx-d">${a.desc}</span>
    </button>`).join('')}
  </div>`;
const apxBtn = document.getElementById('apxBtn');
const apxToggle = open => {
  const o = open===undefined ? !apx.classList.contains('open') : open;
  apx.classList.toggle('open', o);
  apxBtn.setAttribute('aria-expanded', o);
};
apxBtn.addEventListener('click', e=>{ e.stopPropagation(); apxToggle(); });
apx.addEventListener('click', e=>{ if(e.target.closest('.apx-item')) apxToggle(false); });
document.addEventListener('click', e=>{ if(!apx.contains(e.target)) apxToggle(false); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && apx.classList.contains('open')){ e.stopPropagation(); e.preventDefault(); apxToggle(false); } }, true);

const accentOf = i => (i>=1 && i<=stages.length) ? stages[i-1].color : getComputedStyle(document.documentElement).getPropertyValue('--epam');

let cur = -1;
function go(i){
  i = Math.max(0, Math.min(TOTAL-1, i));
  if(i===cur) return;
  cur = i;
  screens.forEach(sc=> sc.classList.toggle('active', +sc.dataset.i===i));
  // restart point/loop animations on the active screen
  const act = screens[i];
  act.querySelectorAll('.stp').forEach((p,k)=>{ p.style.animation='none'; p.offsetHeight; p.style.animation=''; p.style.animationDelay=(0.05+k*0.09)+'s'; });

  const accent = accentOf(i).trim();
  document.documentElement.style.setProperty('--accent', accent);

  // header steps
  [...stepper.children].forEach((st,k)=>{
    const sn=k+1;
    st.classList.toggle('current', sn===i);
    st.classList.toggle('done', i>sn || i===TOTAL-1);
  });
  // dots
  [...dots.children].forEach((d,k)=> d.classList.toggle('on', k===i));
  // appendix navigator: highlight when on one of its screens, close the menu on any move
  const apxB = document.getElementById('apxBtn');
  if(apxB){
    document.getElementById('apx').classList.remove('open');
    apxB.setAttribute('aria-expanded','false');
    apxB.classList.toggle('on', appendices.some(a=>a.i===i));
    document.querySelectorAll('.apx-item').forEach(it=> it.classList.toggle('on', +it.dataset.go===i));
  }
  // progress
  document.getElementById('bar').style.width = (i/(TOTAL-1)*100)+'%';
  // footer buttons
  back.disabled = i===0;
  const last = i===TOTAL-1;
  nextLabel.textContent = last ? 'Restart' : (i===0 ? 'Start the walkthrough' : 'Next');
  nextIcon.style.display = last ? 'none' : '';
  act.scrollTop = 0;
}

/* nav wiring */
const back = document.getElementById('back');
const next = document.getElementById('next');
const nextLabel = document.createElement('span'); nextLabel.textContent='Next';
const nextIcon = next.querySelector('svg');
next.insertBefore(nextLabel, nextIcon);
next.childNodes.forEach(n=>{ if(n.nodeType===3) n.textContent=''; }); // clear stray text node

back.onclick = ()=> go(cur-1);
next.onclick = ()=> cur===TOTAL-1 ? go(0) : go(cur+1);
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if(g) go(+g.dataset.go);
});
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-vcm]');
  if(t){ document.querySelectorAll('.vcm-tab').forEach(x=>x.classList.toggle('on', x===t)); renderMaturity(t.dataset.vcm); }
});
document.addEventListener('keydown', e=>{
  if(drillOpen) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); cur<TOTAL-1 && go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'||e.key==='Escape'){ go(0); }
  else if(e.key==='End'){ go(TOTAL-1); }
  else if(/^[1-7]$/.test(e.key)){ go(+e.key); }
});

/* FinOps discipline tabs */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-fin]');
  if(t){ document.querySelectorAll('[data-fin]').forEach(x=>x.classList.toggle('on', x===t)); renderFinops(t.dataset.fin); }
});

/* drill-down overlays: one generic controller, one open at a time */
const drillEls = {};
Object.keys(drilldowns).forEach(id=>{
  const root=document.getElementById('drill-'+id);
  drillEls[id]={ root, screens:[...root.querySelectorAll('.drill-screen')], steps:[...root.querySelectorAll('.drill-step')],
    prev:root.querySelector('.d-prev'), next:root.querySelector('.d-next') };
});
let activeDrill=null, drillIdx=0, drillOpen=false;

/* routing task-flow animation (cost-model screen 2): one stream, two diverging bills */
const routeAnim = (()=>{
  const cvs=document.getElementById('routeCanvas');
  if(!cvs) return {start(){},stop(){}};
  const ctx=cvs.getContext('2d');
  const W=460,H=272, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SRC={x:44,y:136}, RTR={x:150,y:136};
  const TIER={ small:{x:362,y:50,c:'#1BA877',r:16,label:'Small',share:'60%',price:'$0.10 / $0.40'},
               mid:{x:362,y:136,c:'#3B6FD4',r:19,label:'Mid',share:'30%',price:'$3 / $15'},
               frontier:{x:362,y:222,c:'#E5484D',r:23,label:'Frontier',share:'10%',price:'$5 / $25'} };
  const TYPE={ easy:{c:'#1BA877',tier:'small',leg:0.094,cas:0.002},
               medium:{c:'#3B6FD4',tier:'mid',leg:0.278,cas:0.167},
               hard:{c:'#E5484D',tier:'frontier',leg:0.738,cas:0.738} };
  const elLeg=document.getElementById('rmLeg'), elCas=document.getElementById('rmCas'), elSave=document.getElementById('rmSave');
  let parts=[], leg=0, cas=0, done=0, frame=0, hold=0, raf=null, running=false, bagI=0;
  // deterministic 60/30/10 bag so the live saving stays true to the ~41% headline
  const BAG=['easy','easy','medium','easy','hard','easy','medium','easy','medium','easy'];
  const roll=()=>BAG[bagI++ % BAG.length];
  const meters=()=>{ elLeg.textContent='$'+leg.toFixed(3); elCas.textContent='$'+cas.toFixed(3);
    elSave.textContent = leg>0.02 ? Math.round((1-cas/leg)*100)+'%' : '—'; };
  const disc=(x,y,r,color)=>{ ctx.globalAlpha=.15;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=color;ctx.fill();ctx.globalAlpha=1;
    ctx.lineWidth=1.8;ctx.strokeStyle=color;ctx.stroke(); };
  const dot=(x,y,r,color)=>{ ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=color;ctx.fill(); };
  const label=(x,y,t,col,sz,wt)=>{ ctx.fillStyle=col;ctx.font=(wt||600)+' '+(sz||11)+'px "Nunito Sans",sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y); };
  const link=(a,b)=>{ ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke(); };
  function scene(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#E1E5EF';ctx.lineWidth=1.4;ctx.setLineDash([2,6]);
    link(SRC,RTR); for(const k in TIER) link(RTR,TIER[k]); ctx.setLineDash([]);
    disc(SRC.x,SRC.y,16,'#8A90A2'); label(SRC.x,SRC.y-25,'Tasks','#5C627A',11,700); label(SRC.x,SRC.y+28,'mixed difficulty','#9298AD',9,600);
    disc(RTR.x,RTR.y,20,'#1593B6'); label(RTR.x,RTR.y-29,'Router','#5C627A',11,700); label(RTR.x,RTR.y+34,'cheapest that fits','#9298AD',9,600);
    for(const k in TIER){const T=TIER[k]; disc(T.x,T.y,T.r,T.c); label(T.x,T.y-T.r-7,T.label+' · '+T.share,'#5C627A',11,700); label(T.x,T.y+T.r+14,T.price,'#9298AD',9,600);}
  }
  function step(){
    scene();
    parts.forEach(p=>{
      const dx=p.tgt.x-p.x, dy=p.tgt.y-p.y, d=Math.hypot(dx,dy)||1, sp=3;
      if(d<sp){ p.x=p.tgt.x;p.y=p.tgt.y;
        if(p.stage===0){p.stage=1;p.tgt=TIER[TYPE[p.t].tier];}
        else if(!p.done){p.done=true; leg+=TYPE[p.t].leg; cas+=TYPE[p.t].cas; done++; meters();}
      } else { p.x+=dx/d*sp; p.y+=dy/d*sp; }
      dot(p.x,p.y,3.8, p.stage===0 ? '#B4BCD2' : TYPE[p.t].c);   // grey until the router judges it
    });
    parts=parts.filter(p=>!p.done);
    frame++;
    if(done<60 && frame%7===0 && parts.length<20) parts.push({x:SRC.x,y:SRC.y,t:roll(),stage:0,tgt:RTR});
    if(done>=60 && parts.length===0){ hold++; if(hold>90){leg=0;cas=0;done=0;hold=0;bagI=0;meters();} }
    if(running) raf=requestAnimationFrame(step);
  }
  const size=()=>{ const dpr=Math.min(2,window.devicePixelRatio||1); cvs.width=W*dpr; cvs.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  function start(){ size(); parts=[];leg=0;cas=0;done=0;frame=0;hold=0;bagI=0;
    if(reduce){ running=false; scene(); leg=0.213;cas=0.125;meters(); return; }
    meters(); running=true; raf=requestAnimationFrame(step); }
  function stop(){ running=false; if(raf){cancelAnimationFrame(raf);raf=null;} }
  return {start,stop};
})();

/* mediation animation (security screen 2): proposed actions pass a deterministic gate that permits or denies */
const medAnim = (()=>{
  const cvs=document.getElementById('medCanvas');
  if(!cvs) return {start(){},stop(){}};
  const ctx=cvs.getContext('2d');
  const W=460,H=272, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const A='#2E6FD6', RED='#E5484D', GX=216;
  const SRC={x:52,y:136}, TOOL={x:410,y:136};
  let parts=[], frame=0, bagI=0, denyI=0, flash=null, raf=null, running=false;
  const BAG=['p','p','p','p','p','d','p','p','p','p','p','p','d','p','p','p','p','p','p','d'];  // ~15% denied
  const REASONS=[['delete_records()','irreversible'],['transfer_funds()','over lease scope'],
    ['read secrets/*','not on allow-list'],['email → external','data-egress rule'],
    ['spawn sub-agent','unverified'],['write prod DB','untrusted input']];
  const roll=()=>BAG[bagI++ % BAG.length];
  const dot=(x,y,r,c)=>{ ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=c;ctx.fill(); };
  const label=(x,y,t,c,sz,wt)=>{ ctx.fillStyle=c;ctx.font=(wt||600)+' '+(sz||11)+'px "Nunito Sans",sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y); };
  const rr=(x,y,w,h,r)=>{ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); };
  const ring=(x,y,r,c)=>{ ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.lineWidth=1.8;ctx.strokeStyle=c;ctx.stroke(); };
  function scene(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(46,111,214,.10)';ctx.strokeStyle=A;ctx.lineWidth=1.8;
    rr(GX-16,52,32,166,10);ctx.fill();ctx.stroke();
    label(GX,40,'Policy decision point',A,11.5,800);
    label(GX,234,'deterministic · fail-closed','#9298AD',9,600);
    if(flash){ ctx.globalAlpha=flash.t<80?1:Math.max(0,1-(flash.t-80)/28); label(GX,254,'× '+flash.a+'  —  '+flash.r,'#C62A2F',10,700); ctx.globalAlpha=1; }
    ctx.globalAlpha=.14;dot(SRC.x,SRC.y,16,'#8A90A2');ctx.globalAlpha=1;ring(SRC.x,SRC.y,16,'#8A90A2');
    label(SRC.x,SRC.y-24,'Agent','#5C627A',11,700);label(SRC.x,SRC.y+30,'proposes','#9298AD',9,600);
    ctx.globalAlpha=.14;dot(TOOL.x,TOOL.y,16,A);ctx.globalAlpha=1;ring(TOOL.x,TOOL.y,16,A);
    label(TOOL.x,TOOL.y-24,'Act','#5C627A',11,700);
  }
  function step(){
    scene();
    parts.forEach(p=>{
      if(p.stage===0){ p.x+=2.6; if(p.x>=GX){ p.x=GX; if(p.verdict==='p'){p.stage=1;} else {p.stage=2;p.t=0; if(p.reason) flash={a:p.reason[0],r:p.reason[1],t:0};} } }
      else if(p.stage===1){ const dx=TOOL.x-p.x, dy=TOOL.y-p.y, d=Math.hypot(dx,dy)||1, sp=2.8; if(d<sp){p.done=true;} else {p.x+=dx/d*sp;p.y+=dy/d*sp;} }
      else { p.t++; if(p.t>30)p.done=true; }
      if(p.stage===2){
        ctx.globalAlpha=Math.max(0,1-p.t/30);
        ctx.strokeStyle=RED;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(p.x-4,p.y-4);ctx.lineTo(p.x+4,p.y+4);ctx.moveTo(p.x+4,p.y-4);ctx.lineTo(p.x-4,p.y+4);ctx.stroke();
        ctx.globalAlpha=1;
      } else {
        dot(p.x,p.y,4, p.stage===0?'#B4BCD2':A);
      }
    });
    parts=parts.filter(p=>!p.done);
    if(flash){ flash.t++; if(flash.t>108) flash=null; }
    frame++;
    if(frame%15===0 && parts.length<12){ const v=roll(); const reason = v==='d'? REASONS[denyI++ % REASONS.length] : null;
      const y=136+(((bagI*37)%80)-40); parts.push({x:SRC.x+16,y,stage:0,verdict:v,reason,t:0}); }
    if(running) raf=requestAnimationFrame(step);
  }
  const size=()=>{ const dpr=Math.min(2,window.devicePixelRatio||1); cvs.width=W*dpr; cvs.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  function start(){ size(); parts=[];frame=0;bagI=0;denyI=0;flash=null; if(reduce){ running=false; scene(); return; } running=true; raf=requestAnimationFrame(step); }
  function stop(){ running=false; if(raf){cancelAnimationFrame(raf);raf=null;} }
  return {start,stop};
})();

function goDrill(k){
  const D=drillEls[activeDrill]; if(!D) return;
  k = Math.max(0, Math.min(D.screens.length-1, k));
  drillIdx = k;
  D.screens.forEach((s,i)=> s.classList.toggle('active', i===k));
  D.steps.forEach((el,i)=>{ el.classList.toggle('current', i===k); el.classList.toggle('done', i<k); });
  const act = D.screens[k];
  act.querySelectorAll('.dgm .draw,.dgm .bar,.dgm .pop').forEach(el=>{ el.style.animation='none'; el.offsetHeight; el.style.animation=''; });
  act.scrollTop = 0;
  routeAnim.stop(); medAnim.stop();
  if(activeDrill==='costmodel' && k===1) routeAnim.start();
  else if(activeDrill==='security' && k===1) medAnim.start();
  D.prev.style.visibility = k===0 ? 'hidden' : '';
  D.next.style.visibility = k===D.screens.length-1 ? 'hidden' : '';
}
function openDrill(id){
  if(!drillEls[id]) return;
  if(activeDrill) closeDrill();
  activeDrill=id; drillOpen=true;
  const D=drillEls[id]; D.root.classList.add('open'); D.root.setAttribute('aria-hidden','false');
  goDrill(0);
}
function closeDrill(){
  if(!activeDrill) return;
  const D=drillEls[activeDrill]; D.root.classList.remove('open'); D.root.setAttribute('aria-hidden','true');
  routeAnim.stop(); medAnim.stop(); activeDrill=null; drillOpen=false;
}
document.addEventListener('click', e=>{
  const cta=e.target.closest('[data-open-drill]'); if(cta){ openDrill(cta.dataset.openDrill); return; }
  if(e.target.closest('[data-dclose]')){ closeDrill(); return; }
  if(e.target.closest('.d-prev')){ goDrill(drillIdx-1); return; }
  if(e.target.closest('.d-next')){ goDrill(drillIdx+1); return; }
  const ds=e.target.closest('[data-dgo]'); if(ds){ goDrill(+ds.dataset.dgo); return; }
  const rb=e.target.closest('.reveal-btn'); if(rb){ rb.classList.toggle('on'); rb.nextElementSibling.classList.toggle('show'); return; }
  const on=e.target.closest('[data-drill-onward]'); if(on){ const t=on.dataset.drillOnward||'finops'; closeDrill();
    if(t.indexOf('drill:')===0){ const id=t.slice(6); go(drilldowns[id].stage); openDrill(id); }
    else if(t.indexOf('finops')===0){ go(TOTAL-1); const tab=t.split(':')[1]; if(tab){ document.querySelectorAll('[data-fin]').forEach(x=>x.classList.toggle('on', x.dataset.fin===tab)); renderFinops(tab); } }
    else { go(TOTAL-1); } }
});
document.addEventListener('keydown', e=>{
  if(!drillOpen) return;
  if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeDrill(); }
  else if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); e.stopPropagation(); goDrill(drillIdx+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); e.stopPropagation(); goDrill(drillIdx-1); }
}, true);

go(0);
</script>
